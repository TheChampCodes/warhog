; PlatformIO build for PigletNode (standalone ESP-Now mesh node sketch).
; Seeed XIAO ESP32-C5 — no display, GPS, or SD.

[platformio]
src_dir = .

[env:pigletnode_c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino

board_build.f_cpu = 80000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Scheduler node features — LIVE: worker BSSID dedup + adaptive dwell/DFS-passive.
    -I../scheduler
    -DPIG_FEAT_DEDUP=1
    -DPIG_FEAT_ADAPTIVE_DWELL=1
    -DPIG_FEAT_PAIR_SCHED=1
build_src_filter = +<*> -<build/> -<.pio/>

monitor_speed = 115200
upload_speed = 921600
; C5 USB-Serial/JTAG drops when the esptool stub loads; write through the ROM loader.
upload_flags = --no-stub
