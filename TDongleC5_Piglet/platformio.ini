; PlatformIO build for the LilyGO T-Dongle C5 Piglet (standalone sketch).
; ESP32-C5, ST7735 0.96" TFT, SD, GPS, APA102 LED.

[platformio]
src_dir = .

[env:tdongle_c5]
; Pinned to 55.03.39 (Arduino-ESP32 3.3.9), same as the other C5 builds.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino

board_build.f_cpu = 80000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Arduino IDE build output lives in build/; don't compile anything from it
build_src_filter = +<*> -<build/> -<.pio/>

monitor_speed = 115200
upload_speed = 921600
; C5 USB-Serial/JTAG drops when the esptool stub loads; write through the ROM loader.
upload_flags = --no-stub

lib_deps =
    adafruit/Adafruit GFX Library
    ; Pin 1.5.0: newer releases declare "depends=...,SD", which drags in the
    ; registry Arduino SD whose Sd2PinMap.h errors out on the C5 and shadows
    ; the ESP32 core's built-in SD. 1.5.0 has no such dependency.
    adafruit/Adafruit ST7735 and ST7789 Library@1.5.0
    mikalhart/TinyGPSPlus
    bblanchon/ArduinoJson
