; WarHogNodeC3 — ESP32-C3 0.42" OLED board
; Uses pioarduino (Arduino-ESP32 3.x); the stock espressif32 platform ships 2.x,
; which lacks the esp_now_recv_info_t callback signature this code needs.

[env:esp32c3_oled]
; Pinned to 55.03.39: "stable" (55.3.312+) ships libs with paths >260 chars,
; which fail to unpack on Windows unless long paths are enabled.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Two ~1.9 MB app slots + otadata so the Core can push firmware over the air.
; The C3 image is ~1.3 MB, so it fits a slot with headroom. Same 0x10000 app
; offset / 0xe000 otadata as before, so the merged-image layout is unchanged.
; Moving off huge_app.csv needs ONE USB reflash per node; after that, updates
; can come from the Core. (NimBLE still fits in a 1.9 MB slot.)
board_build.partitions = min_spiffs.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Scheduler node features — LIVE: worker BSSID dedup + adaptive dwell/DFS-passive.
    -I../scheduler
    -DPIG_FEAT_DEDUP=1
    -DPIG_FEAT_ADAPTIVE_DWELL=1
    -DPIG_FEAT_PAIR_SCHED=1

lib_deps =
    olikraus/U8g2
    h2zero/NimBLE-Arduino@^2.3.0
