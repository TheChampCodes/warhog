; PlatformIO build for the Waveshare ESP32-C6-LCD-1.47 WarHog (standalone sketch).
; ESP32-C6, ST7789 1.47" TFT (LovyanGFX), SD, GPS.

[platformio]
src_dir = .

[env:waveshare_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<build/> -<.pio/>

monitor_speed = 115200
upload_speed = 921600
; C6 USB-Serial/JTAG can drop when the esptool stub loads; write through the ROM loader.
upload_flags = --no-stub

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    mikalhart/TinyGPSPlus
    bblanchon/ArduinoJson
